[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatMPD"
version = "0.3.0"
description = "A local-first autonomous assistant with persistent memory, extensible skills and tools, verified coding, media, game specialists, and mobile access"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
chatmpd = "chatmpd.app:main"

[project.optional-dependencies]
desktop = ["pywebview>=6.2,<7", "qrcode>=8,<9"]
documents = ["pypdf>=6,<7", "openpyxl>=3.1,<4"]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
include = ["chatmpd*"]
